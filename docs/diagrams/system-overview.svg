<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="sys-t sys-d" class="diagram-svg"><title id="sys-t">Systemübersicht n8n-local</title><desc id="sys-d">Lokaler Windows-, Linux- oder macOS-Host mit Browser, optionalem Host-Updater und Projektordner; Docker Engine mit n8n und PostgreSQL in getrennten Netzen und drei Volumes.</desc>
