<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="net-t net-d" class="diagram-svg"><title id="net-t">Netzwerkstruktur</title><desc id="net-d">n8n hängt an egress und backend; PostgreSQL nur am internen backend-Netz ohne Internetzugang; Host-Ports nur auf 127.0.0.1.</desc>
<style>
.bx{fill:var(--d-box,#fff);stroke:var(--d-stroke,#5b6b7f);stroke-width:1.4}
.bx.acc{fill:var(--d-acc-bg,#e8f1ff);stroke:var(--d-acc,#2563eb);stroke-width:1.8}
.bx.ok{fill:var(--d-ok-bg,#e7f7ee);stroke:var(--d-ok,#15803d)}
.bx.bad{fill:var(--d-bad-bg,#fdecec);stroke:var(--d-bad,#b91c1c)}
.bx.dash{stroke-dasharray:5 4}
.rg{fill:var(--d-region,#f4f6f9);stroke:var(--d-stroke-soft,#a9b4c2);stroke-width:1.2}
.rg.net{fill:var(--d-net,#eef6f1);stroke:var(--d-net-stroke,#6aa287);stroke-dasharray:6 4}
.rg.int{fill:var(--d-int,#f6effa);stroke:var(--d-int-stroke,#9a76b5);stroke-dasharray:6 4}
.t{fill:var(--d-text,#1f2937);font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif}
.s{fill:var(--d-muted,#4b5563);font:12.5px system-ui,-apple-system,"Segoe UI",sans-serif}
.rt{fill:var(--d-muted,#4b5563);font:600 12.5px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.02em}
.lb{fill:var(--d-text,#1f2937);font:12px system-ui,-apple-system,"Segoe UI",sans-serif;paint-order:stroke;stroke:var(--d-halo,#fff);stroke-width:4px;stroke-linejoin:round}
.ln{fill:none;stroke:var(--d-line,#475569);stroke-width:1.6}
.ln.dash{stroke-dasharray:6 4}
.ln.bad{stroke:var(--d-bad,#b91c1c)}
.ah{fill:var(--d-line,#475569)}
.ahb{fill:var(--d-bad,#b91c1c)}
</style><defs><marker id="ah-net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ahb-net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahb" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="rg " x="20" y="16" width="920" height="96" rx="12"/><text class="rt" x="34" y="36">WINDOWS-HOST · LOOPBACK 127.0.0.1</text><rect class="bx " x="50" y="50" width="260" height="46" rx="8"/><text class="t" x="180.0" y="69.0" text-anchor="middle">127.0.0.1:5678</text><text class="s" x="180.0" y="87.0" text-anchor="middle">veröffentlichter n8n-Port</text><rect class="bx acc" x="350" y="50" width="260" height="46" rx="8"/><text class="t" x="480.0" y="69.0" text-anchor="middle">127.0.0.1:5680</text><text class="s" x="480.0" y="87.0" text-anchor="middle">Host-Updater</text><rect class="bx bad dash" x="650" y="50" width="270" height="46" rx="8"/><text class="t" x="785.0" y="69.0" text-anchor="middle">LAN / Internet → Host</text><text class="s" x="785.0" y="87.0" text-anchor="middle">kein Zugriff (nur Loopback)</text><rect class="rg net" x="20" y="140" width="450" height="170" rx="12"/><text class="rt" x="34" y="160">n8n-local_egress · Bridge · 172.19.0.0/16</text><rect class="rg int" x="490" y="140" width="450" height="170" rx="12"/><text class="rt" x="504" y="160">n8n-local_backend · internal · 172.18.0.0/16</text><rect class="bx acc" x="385" y="200" width="190" height="64" rx="8"/><text class="t" x="480.0" y="228.0" text-anchor="middle">n8n</text><text class="s" x="480.0" y="246.0" text-anchor="middle">in beiden Netzen</text><path class="bx " d="M715,203 a90.0,7 0 0,1 180,0 v56 a90.0,7 0 0,1 -180,0 z"/><path class="bx " style="fill:none" d="M715,203 a90.0,7 0 0,0 180,0"/><text class="t" x="805.0" y="230.0" text-anchor="middle">postgres</text><text class="s" x="805.0" y="248.0" text-anchor="middle">5432</text><rect class="bx " x="80" y="345" width="270" height="46" rx="8"/><text class="t" x="215.0" y="364.0" text-anchor="middle">Internet</text><text class="s" x="215.0" y="382.0" text-anchor="middle">api.github.com (HTTPS)</text><path class="ln " d="M180,96 L180,126 L420,126 L420,198" marker-end="url(#ah-net)"/><text class="lb" x="300" y="122" text-anchor="middle">Port-Weiterleitung</text><path class="ln " d="M540,200 L540,126 L490,126 L490,98" marker-end="url(#ah-net)"/><text class="lb" x="550" y="122" text-anchor="start">host.docker.internal</text><path class="ln " d="M575,232 L713,232" marker-end="url(#ah-net)"/><text class="lb" x="644" y="224" text-anchor="middle">SQL</text><path class="ln " d="M410,264 L300,343" marker-end="url(#ah-net)"/><text class="lb" x="330" y="300" text-anchor="middle">ausgehend</text><path class="ln bad dash" d="M805,268 L805,352" marker-end="url(#ahb-net)"/><text class="lb" x="820" y="336" text-anchor="start">kein Internet</text><text class="s" x="820" y="354" text-anchor="start">(internal: true)</text></svg>