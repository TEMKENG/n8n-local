<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1000" role="img" aria-labelledby="upd-t upd-d" class="diagram-svg"><title id="upd-t">Automatisierter Update-Prozess</title><desc id="upd-d">Workflow-Schritte von Montag 03:00 bis zur Protokollierung und die vom Host-Updater ausgeführten Schritte Backup, Pull, Wechsel, Healthchecks, Rollback.</desc>
<style>
.bx{fill:var(--d-box,#fff);stroke:var(--d-stroke,#5b6b7f);stroke-width:1.4}
.bx.acc{fill:var(--d-acc-bg,#e8f1ff);stroke:var(--d-acc,#2563eb);stroke-width:1.8}
.bx.ok{fill:var(--d-ok-bg,#e7f7ee);stroke:var(--d-ok,#15803d)}
.bx.bad{fill:var(--d-bad-bg,#fdecec);stroke:var(--d-bad,#b91c1c)}
.bx.dash{stroke-dasharray:5 4}
.rg{fill:var(--d-region,#f4f6f9);stroke:var(--d-stroke-soft,#a9b4c2);stroke-width:1.2}
.rg.net{fill:var(--d-net,#eef6f1);stroke:var(--d-net-stroke,#6aa287);stroke-dasharray:6 4}
.rg.int{fill:var(--d-int,#f6effa);stroke:var(--d-int-stroke,#9a76b5);stroke-dasharray:6 4}
.t{fill:var(--d-text,#1f2937);font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif}
.s{fill:var(--d-muted,#4b5563);font:12.5px system-ui,-apple-system,"Segoe UI",sans-serif}
.rt{fill:var(--d-muted,#4b5563);font:600 12.5px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.02em}
.lb{fill:var(--d-text,#1f2937);font:12px system-ui,-apple-system,"Segoe UI",sans-serif;paint-order:stroke;stroke:var(--d-halo,#fff);stroke-width:4px;stroke-linejoin:round}
.ln{fill:none;stroke:var(--d-line,#475569);stroke-width:1.6}
.ln.dash{stroke-dasharray:6 4}
.ln.bad{stroke:var(--d-bad,#b91c1c)}
.ah{fill:var(--d-line,#475569)}
.ahb{fill:var(--d-bad,#b91c1c)}
</style><defs><marker id="ah-upd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ahb-upd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahb" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="rg " x="20" y="4" width="620" height="884" rx="12"/><text class="rt" x="34" y="24">N8N-WORKFLOW · WEEKLY N8N VERSION CHECKER &amp; AUTO UPDATER</text><rect class="bx acc" x="150" y="40" width="300" height="46" rx="23"/><text class="t" x="300.0" y="59.0" text-anchor="middle">Montag 03:00 (Europe/Berlin)</text><text class="s" x="300.0" y="77.0" text-anchor="middle">Schedule Trigger · + manueller Test</text><rect class="bx " x="150" y="116" width="300" height="50" rx="8"/><text class="t" x="300.0" y="137.0" text-anchor="middle">Installierte Version ermitteln</text><text class="s" x="300.0" y="155.0" text-anchor="middle">GET /status (Host-Updater)</text><rect class="bx " x="150" y="196" width="300" height="50" rx="8"/><text class="t" x="300.0" y="217.0" text-anchor="middle">Stabile Releases abrufen</text><text class="s" x="300.0" y="235.0" text-anchor="middle">GitHub API · n8n-io/n8n</text><rect class="bx bad" x="470" y="196" width="150" height="50" rx="8"/><text class="t" x="545.0" y="217.0" text-anchor="middle">Fehler</text><text class="s" x="545.0" y="235.0" text-anchor="middle">aufbereiten</text><rect class="bx " x="150" y="276" width="300" height="50" rx="8"/><text class="t" x="300.0" y="297.0" text-anchor="middle">Versionen vergleichen</text><text class="s" x="300.0" y="315.0" text-anchor="middle">Semver · ohne Vorabversionen</text><polygon class="bx " points="300.0,348.0 415.0,386 300.0,424.0 185.0,386"/><text class="t" x="300.0" y="382" text-anchor="middle">Neue Version</text><text class="s" x="300.0" y="400" text-anchor="middle">gleiche Major?</text><rect class="bx " x="150" y="456" width="300" height="50" rx="8"/><text class="t" x="300.0" y="477.0" text-anchor="middle">Vorabprüfung (Dry-Run)</text><text class="s" x="300.0" y="495.0" text-anchor="middle">POST /update · dryRun</text><polygon class="bx " points="300.0,531.0 395.0,566 300.0,601.0 205.0,566"/><text class="t" x="300.0" y="571" text-anchor="middle">bestanden?</text><rect class="bx acc" x="150" y="636" width="300" height="50" rx="8"/><text class="t" x="300.0" y="657.0" text-anchor="middle">Update anfordern</text><text class="s" x="300.0" y="675.0" text-anchor="middle">POST /update → 202 Accepted</text><rect class="bx " x="150" y="726" width="300" height="50" rx="8"/><text class="t" x="300.0" y="747.0" text-anchor="middle">Protokolleintrag erstellen</text><text class="s" x="300.0" y="765.0" text-anchor="middle">decision · reason · Versionen</text><rect class="bx " x="150" y="812" width="300" height="50" rx="8"/><text class="t" x="300.0" y="833.0" text-anchor="middle">Ergebnis protokollieren</text><text class="s" x="300.0" y="851.0" text-anchor="middle">POST /check-log → logs/</text><path class="ln " d="M300.0,86 L300.0,114" marker-end="url(#ah-upd)"/><path class="ln " d="M300.0,166 L300.0,194" marker-end="url(#ah-upd)"/><path class="ln " d="M300.0,246 L300.0,274" marker-end="url(#ah-upd)"/><path class="ln " d="M300.0,326 L300.0,346" marker-end="url(#ah-upd)"/><path class="ln " d="M300.0,424 L300.0,454" marker-end="url(#ah-upd)"/><path class="ln " d="M300.0,506 L300.0,529" marker-end="url(#ah-upd)"/><path class="ln " d="M300.0,601 L300.0,634" marker-end="url(#ah-upd)"/><path class="ln " d="M300.0,686 L300.0,724" marker-end="url(#ah-upd)"/><path class="ln " d="M300.0,776 L300.0,810" marker-end="url(#ah-upd)"/><text class="lb" x="310.0" y="446" text-anchor="start">ja</text><text class="lb" x="310.0" y="624" text-anchor="start">ja</text><path class="ln " d="M450,221 L468,221" marker-end="url(#ah-upd)"/><path class="ln " d="M545,246 L545,837 L452,837" marker-end="url(#ah-upd)"/><path class="ln " d="M185.0,386 L60,386 L60,751 L148,751" marker-end="url(#ah-upd)"/><text class="lb" x="96" y="378" text-anchor="middle">nein</text><path class="ln " d="M205.0,566 L90,566 L90,751" marker-end="url(#ah-upd)"/><text class="lb" x="116" y="558" text-anchor="middle">nein</text><rect class="rg " x="660" y="396" width="280" height="596" rx="12"/><text class="rt" x="674" y="416">HOST-UPDATER · SEPARATER PROZESS</text><rect class="bx " x="680" y="456" width="240" height="50" rx="8"/><text class="t" x="800.0" y="477.0" text-anchor="middle">Sperre setzen</text><text class="s" x="800.0" y="495.0" text-anchor="middle">Vorabprüfung wiederholen</text><rect class="bx " x="680" y="530" width="240" height="50" rx="8"/><text class="t" x="800.0" y="551.0" text-anchor="middle">Backup erstellen</text><text class="s" x="800.0" y="569.0" text-anchor="middle">und verifizieren</text><rect class="bx " x="680" y="604" width="240" height="50" rx="8"/><text class="t" x="800.0" y="625.0" text-anchor="middle">Image pullen</text><text class="s" x="800.0" y="643.0" text-anchor="middle">docker.n8n.io/n8nio/n8n:x.y.z</text><rect class="bx " x="680" y="678" width="240" height="56" rx="8"/><text class="t" x="800.0" y="702.0" text-anchor="middle">N8N_VERSION setzen</text><text class="s" x="800.0" y="720.0" text-anchor="middle">compose up -d --no-deps n8n</text><polygon class="bx " points="800.0,765.0 895.0,800 800.0,835.0 705.0,800"/><text class="t" x="800.0" y="796" text-anchor="middle">Healthchecks</text><text class="s" x="800.0" y="814" text-anchor="middle">6 Prüfungen</text><rect class="bx ok" x="672" y="872" width="122" height="56" rx="8"/><text class="t" x="733.0" y="896.0" text-anchor="middle">Version</text><text class="s" x="733.0" y="914.0" text-anchor="middle">bestätigt</text><rect class="bx bad" x="808" y="872" width="122" height="56" rx="8"/><text class="t" x="869.0" y="896.0" text-anchor="middle">Rollback</text><text class="s" x="869.0" y="914.0" text-anchor="middle">DB+Volumes</text><rect class="bx bad" x="808" y="942" width="122" height="42" rx="8"/><text class="t" x="869.0" y="968.0" text-anchor="middle">rolled-back</text><path class="ln " d="M800.0,506 L800.0,528" marker-end="url(#ah-upd)"/><path class="ln " d="M800.0,580 L800.0,602" marker-end="url(#ah-upd)"/><path class="ln " d="M800.0,654 L800.0,676" marker-end="url(#ah-upd)"/><path class="ln " d="M800.0,734 L800.0,763" marker-end="url(#ah-upd)"/><path class="ln " d="M740.0,818 L733,870" marker-end="url(#ah-upd)"/><text class="lb" x="712" y="848" text-anchor="middle">ok</text><path class="ln " d="M860.0,818 L869,870" marker-end="url(#ah-upd)"/><text class="lb" x="900" y="848" text-anchor="middle">Fehler</text><path class="ln " d="M869,928 L869,940" marker-end="url(#ah-upd)"/><path class="ln dash" d="M450,661 L600,661 L600,481 L678,481" marker-end="url(#ah-upd)"/><text class="lb" x="600" y="470" text-anchor="middle">20 s später</text><text class="s" x="800" y="442" text-anchor="middle">Abbruch ohne Änderung bei Backup-Fehler</text></svg>