<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="bak-t bak-d" class="diagram-svg"><title id="bak-t">Backup- und Rollback-Ablauf</title><desc id="bak-d">Backup in acht Schritten von der Speicherprüfung bis zur Aufbewahrung; Rollback stellt Datenbank, Volumes und Version gemeinsam wieder her.</desc>
<style>
.bx{fill:var(--d-box,#fff);stroke:var(--d-stroke,#5b6b7f);stroke-width:1.4}
.bx.acc{fill:var(--d-acc-bg,#e8f1ff);stroke:var(--d-acc,#2563eb);stroke-width:1.8}
.bx.ok{fill:var(--d-ok-bg,#e7f7ee);stroke:var(--d-ok,#15803d)}
.bx.bad{fill:var(--d-bad-bg,#fdecec);stroke:var(--d-bad,#b91c1c)}
.bx.dash{stroke-dasharray:5 4}
.rg{fill:var(--d-region,#f4f6f9);stroke:var(--d-stroke-soft,#a9b4c2);stroke-width:1.2}
.rg.net{fill:var(--d-net,#eef6f1);stroke:var(--d-net-stroke,#6aa287);stroke-dasharray:6 4}
.rg.int{fill:var(--d-int,#f6effa);stroke:var(--d-int-stroke,#9a76b5);stroke-dasharray:6 4}
.t{fill:var(--d-text,#1f2937);font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif}
.s{fill:var(--d-muted,#4b5563);font:12.5px system-ui,-apple-system,"Segoe UI",sans-serif}
.rt{fill:var(--d-muted,#4b5563);font:600 12.5px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.02em}
.lb{fill:var(--d-text,#1f2937);font:12px system-ui,-apple-system,"Segoe UI",sans-serif;paint-order:stroke;stroke:var(--d-halo,#fff);stroke-width:4px;stroke-linejoin:round}
.ln{fill:none;stroke:var(--d-line,#475569);stroke-width:1.6}
.ln.dash{stroke-dasharray:6 4}
.ln.bad{stroke:var(--d-bad,#b91c1c)}
.ah{fill:var(--d-line,#475569)}
.ahb{fill:var(--d-bad,#b91c1c)}
</style><defs><marker id="ah-bak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ahb-bak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahb" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="rg " x="10" y="8" width="940" height="250" rx="12"/><text class="rt" x="24" y="28">BACKUP (scripts/backup.ps1 · automatisch vor jedem Update)</text><rect class="bx " x="30" y="44" width="205" height="60" rx="8"/><text class="t" x="132.5" y="70.0" text-anchor="middle">Speicherplatz</text><text class="s" x="132.5" y="88.0" text-anchor="middle">prüfen</text><rect class="bx " x="260" y="44" width="205" height="60" rx="8"/><text class="t" x="362.5" y="70.0" text-anchor="middle">n8n stoppen</text><text class="s" x="362.5" y="88.0" text-anchor="middle">konsistenter Zeitpunkt</text><path class="ln " d="M235,74 L258,74" marker-end="url(#ah-bak)"/><rect class="bx " x="490" y="44" width="205" height="60" rx="8"/><text class="t" x="592.5" y="70.0" text-anchor="middle">pg_dump -Fc</text><text class="s" x="592.5" y="88.0" text-anchor="middle">+ globals</text><path class="ln " d="M465,74 L488,74" marker-end="url(#ah-bak)"/><rect class="bx " x="720" y="44" width="205" height="60" rx="8"/><text class="t" x="822.5" y="70.0" text-anchor="middle">tar n8n_data</text><text class="s" x="822.5" y="88.0" text-anchor="middle">+ n8n_binary</text><path class="ln " d="M695,74 L718,74" marker-end="url(#ah-bak)"/><rect class="bx " x="720" y="170" width="205" height="60" rx="8"/><text class="t" x="822.5" y="196.0" text-anchor="middle">.env + compose</text><text class="s" x="822.5" y="214.0" text-anchor="middle">+ manifest (SHA-256)</text><rect class="bx ok" x="490" y="170" width="205" height="60" rx="8"/><text class="t" x="592.5" y="196.0" text-anchor="middle">Verifikation</text><text class="s" x="592.5" y="214.0" text-anchor="middle">Hashes · pg_restore --list</text><path class="ln " d="M720,200 L697,200" marker-end="url(#ah-bak)"/><rect class="bx " x="260" y="170" width="205" height="60" rx="8"/><text class="t" x="362.5" y="196.0" text-anchor="middle">n8n starten</text><text class="s" x="362.5" y="214.0" text-anchor="middle">.partial → final</text><path class="ln " d="M490,200 L467,200" marker-end="url(#ah-bak)"/><rect class="bx " x="30" y="170" width="205" height="60" rx="8"/><text class="t" x="132.5" y="196.0" text-anchor="middle">Aufbewahrung</text><text class="s" x="132.5" y="214.0" text-anchor="middle">30 Tage · min. 5</text><path class="ln " d="M260,200 L237,200" marker-end="url(#ah-bak)"/><path class="ln " d="M822,104 L822,168" marker-end="url(#ah-bak)"/><rect class="rg " x="10" y="278" width="940" height="140" rx="12"/><text class="rt" x="24" y="298">ROLLBACK (bei fehlgeschlagenem Update)</text><rect class="bx bad" x="30" y="316" width="205" height="60" rx="8"/><text class="t" x="132.5" y="342.0" text-anchor="middle">Update</text><text class="s" x="132.5" y="360.0" text-anchor="middle">fehlgeschlagen</text><rect class="bx " x="260" y="316" width="205" height="60" rx="8"/><text class="t" x="362.5" y="351.0" text-anchor="middle">n8n stoppen</text><path class="ln " d="M235,346 L258,346" marker-end="url(#ah-bak)"/><rect class="bx " x="490" y="316" width="205" height="60" rx="8"/><text class="t" x="592.5" y="342.0" text-anchor="middle">Restore aus</text><text class="s" x="592.5" y="360.0" text-anchor="middle">Pre-Update-Backup</text><path class="ln " d="M465,346 L488,346" marker-end="url(#ah-bak)"/><rect class="bx ok" x="720" y="316" width="205" height="60" rx="8"/><text class="t" x="822.5" y="342.0" text-anchor="middle">Healthchecks</text><text class="s" x="822.5" y="360.0" text-anchor="middle">alte Version</text><path class="ln " d="M695,346 L718,346" marker-end="url(#ah-bak)"/><text class="s" x="480" y="404" text-anchor="middle">Restore = alte N8N_VERSION + Datenbank (drop/create + pg_restore) + beide n8n-Volumes</text></svg>