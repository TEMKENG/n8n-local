# n8n-local: n8n + PostgreSQL, ausschliesslich lokal erreichbar.
# Alle Werte kommen aus .env (siehe .env.example). Versionen sind fest gepinnt.
name: n8n-local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:?Set POSTGRES_VERSION in .env}
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Berlin}
      PGTZ: ${TZ:-Europe/Berlin}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Kein "ports:" -> PostgreSQL ist vom Host/LAN aus nicht erreichbar.
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  # Einmaliger Hilfscontainer: setzt Besitzer des Binary-Volumes auf den
  # n8n-Benutzer (UID 1000), da das Verzeichnis im Image nicht existiert.
  volume-init:
    image: alpine:3.22
    container_name: n8n-volume-init
    restart: "no"
    command: ["sh", "-c", "chown 1000:1000 /binaryData && chmod 750 /binaryData"]
    volumes:
      - n8n_binary:/binaryData
    network_mode: none
    logging: *default-logging

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?Set N8N_VERSION in .env}
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Keine ungeprueften Community-Pakete installieren (Sicherheit).
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: 300
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: 268435456
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: 1000
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Berlin}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_binary:/home/node/.n8n/binaryData
    networks:
      - backend
      - egress
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    healthcheck:
      # readiness prueft zusaetzlich DB-Verbindung und abgeschlossene Migrationen.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging: *default-logging

volumes:
  postgres_data:
    name: n8n-local_postgres_data
  n8n_data:
    name: n8n-local_n8n_data
  n8n_binary:
    name: n8n-local_n8n_binary

networks:
  # Nur n8n <-> PostgreSQL, ohne Internetzugang.
  backend:
    name: n8n-local_backend
    internal: true
  # Ausgehender Internetzugang (GitHub-API) und Port-Veroeffentlichung fuer n8n.
  egress:
    name: n8n-local_egress
